services:
  - type: web
    name: ambulance-agenda
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ambulance-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_FULL_NAME
        value: Coordinacion General
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ambulance-db
